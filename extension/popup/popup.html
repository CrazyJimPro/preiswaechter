<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Preiswächter</title>
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <img src="../icons/icon-32.png" width="20" height="20" alt="">
    <h1>Preiswächter</h1>
    <a href="#" id="open-dashboard" class="headlink">Übersicht →</a>
  </header>

  <section id="current" aria-live="polite">
    <p class="muted">Seite wird ausgewertet …</p>
  </section>

  <section class="tracked">
    <h2>Verfolgte Produkte <span id="count" class="muted"></span></h2>
    <ul id="list" class="plist"></ul>
    <p id="empty" class="muted" hidden>Noch keine Produkte. Öffne eine Produktseite und klicke oben auf „Preis verfolgen“.</p>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
